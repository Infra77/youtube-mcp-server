spring:
  application:
    name: educational-video-curator-mcp
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        name: educational-video-curator
        version: 0.1.0
        stdio: true
        type: SYNC
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/video_curator}
    username: ${DB_USERNAME:curator}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
curator:
  mode: ${CURATOR_MODE:fixture}
  profile: ${CURATOR_PROFILE:local-user}
  general-limit: ${CURATOR_GENERAL_LIMIT:10000}
  search-limit: ${CURATOR_SEARCH_LIMIT:100}
